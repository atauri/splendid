<!DOCTYPE html>
<html lang="es">
<script
    src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
    <title>SPA VueJS sin
        NodeJS</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <link rel="preconnect"
        href="https://fonts.googleapis.com">
    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Viga&display=swap"
        rel="stylesheet">

    <!-- Vue desde CDN -->
    <script
        src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <link rel="stylesheet"
        href="audioNotas.css">
</head>

<body>

    <div id="app">

        <header>
            <h1>{{ Splendid }}
            </h1>
            <h2 id="titulo">
                Notas de Audio
            </h2>
        </header>

        <main>
            <!-- audio .wav -------------------------------------------------------------------------------------------->
            <section
                class="card">
                <h2>Audios
                </h2>
                <!-- para cada audio -->
                <ul
                    class="list-group">
                    <li class="list-group-item list-group-item-action"
                        v-for="audio, id in audios"
                        :key="id"
                        @click="seleccionarAudio(audio)"
                        style="cursor: pointer;">

                        <small>

                            <i class="fa fa-music"
                                aria-hidden="true"></i>

                            <b>{{renombrarFichero(audio)}}</b>

                            <i class="fa fa-trash"
                                aria-hidden="true">
                            </i></small>
                    </li>
                </ul>
            </section>
            <br>

            <!--lista de transcripciones --------------------------------------------------------------->
            <section
                class="card">
                <h2>Transcripciones
                </h2>
                <!-- para cada transcripcion -->
                <!-- para cada audio -->
                <ul
                    class="list-group">
                    <li class="list-group-item list-group-item-action"
                        v-for="transcripcion, id in transcripciones"
                        :key="id"
                        @click="seleccionarTranscripcion(transcripcion)"
                        style="cursor: pointer;">

                        <small>
                            <i class="fa fa-pencil"
                                aria-hidden="true">
                            </i>

                            <b>{{renombrarFichero(transcripcion)}}</b>
                            <i class="fa fa-trash"
                                aria-hidden="true">
                            </i></small>
                    </li>
                </ul>

                <!-- EDICION TRANSCRIPCION-->
                <section
                    id="transcripcion"
                    v-if="transcripcionSeleccionada!=''"
                    class="card">

                    <!--icono de fontawesome para cerrar-->
                    <button
                        type="button"
                        class="btn-close"
                        aria-label="Close"
                        @click="transcripcionSeleccionada = ''; audioSeleccionado = ''; fechaLegible = ''">
                    </button>

                    <h2>Transcripcion:
                    </h2>
                    <p>
                        <b>{{fechaLegible}}</b>
                        (
                        <small>{{audioSeleccionado}}</small>
                        )
                    </p>

                    <div class="btn-group mb-3"
                        role="group"
                        aria-label="Controles de audio">
                        <button
                            type="button"
                            class="btn btn-success"
                            @click="reproducirAudio(audioSeleccionado + '.wav')">
                            {{accionReproductor}}
                        </button>

                    </div>

                    <!-- campo de texto editable de 20 lineas con la transcripcion del audio seleccionado -->
                    <textarea
                        class="form-control"
                        v-model="transcripcion"
                        rows="20"></textarea>

                    <div
                        class="botonera">
                        <button
                            class="btn btn-primary me-2"
                            @click="guardarTranscripcion ">Guardar
                            Transcripción</button>
                        <button
                            class="btn btn-primary me-2"
                            @click="generarFicha ">Generar
                            Ficha</button>

                    </div>

                </section>

                <br>

                <!-- Ficha ----------------------------------------------------------->
                <section
                    class="card"
                    v-if="ficha!==null">
                    <h2>Ficha
                    </h2>
                    <textarea
                        class="form-control"
                        v-model="ficha"
                        rows="20"></textarea>

                    <form
                        class="mt-4">
                        <div
                            class="row g-3 align-items-end">
                            <div
                                class="col-md-3">
                                <label
                                    class="form-label">Timestamp</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    v-model="timestamp"
                                    placeholder="00:00:00" />
                            </div>
                            <div
                                class="col-md-3">
                                <label
                                    class="form-label">Localidad</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    v-model="localidad"
                                    placeholder="Localidad" />
                            </div>
                            <div
                                class="col-md-3">
                                <label
                                    class="form-label">Colmena</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    v-model="colmena"
                                    placeholder="Colmena" />
                            </div>
                            <div
                                class="col-md-2">
                                <button
                                    type="button"
                                    class="btn btn-primary w-100"
                                    @click="insertarFicha">
                                    Insertar
                                </button>
                            </div>
                        </div>
                    </form>
                </section>

        </main>

    </div>

    <script>
        const {createApp} = Vue;

        const app = createApp({
            data() {
                return {
                    titulo: 'Notas de Audio',
                    audios: ["sdasd.wav", "asdasd.wav", "asdasd.wav"],
                    audioSeleccionado: "",
                    transcripciones: ["sdasd.txt", "asdasd.txt", "asdasd.txt"],
                    transcripcionSeleccionada: "",
                    fechaLegible: "",
                    transcripcion: null,
                    ficha: null,
                    timestamp: '',
                    detalle: '',
                    reproductor: null,
                    accionReproductor: "Play"
                };
            }, methods: {
                reproducirAudio(audio) {
                    var url = 'https://atauri.es/splendid/revisiones/wav/' + audio;

                    //sin no hay reproductor, crear uno nuevo
                    if (!this.reproductor) {

                        this.reproductor = new Audio(url);
                        this.reproductor.play();
                    }

                    if (this.accionReproductor === "Pause" && this.reproductor) {
                        this.reproductor.pause();
                        this.accionReproductor = "Play";
                        return;
                    }

                    if (this.accionReproductor === "Play" && this.reproductor) {
                        this.reproductor.pause();
                        this.accionReproductor = "Pause";
                    }


                    this.reproductor.play();
                },
                renombrarFichero(nombre) {

                    try {
                        nombre = nombre.replace('.wav', '');
                    } catch (error) {
                        console.error('Error renombrando fichero:', error);
                    }
                    //pasar el nombre del fichero que es una fecha en formato [YYYY-MM-DD HH_MM] a
                    //   fomato dia y mes en formato texto 
                    try {
                        var partes = nombre.split(' ');
                        var fecha = partes[0].split('-');
                        var hora = partes[1].split('_');
                        var meses = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
                        var fechaLegible = fecha[2] + " de " + meses[parseInt(fecha[1]) - 1]
                            + ' ' + hora[0] + 'h ' + hora[1] + "m";
                        return fechaLegible;
                    } catch (error) {
                        return nombre
                    }

                },
                seleccionarTranscripcion(nombre) {
                    nombre = nombre.replace('.txt', '');
                    alert(nombre);
                    this.transcripcionSeleccionada = nombre;;
                    this.cargarTranscripcion(nombre);
                },
                seleccionarAudio(audio) {
                    // quitar la extensión .wav
                    audio = audio.replace('.wav', '');
                    this.transcripcionSeleccionada = audio + '.txt';

                    //pasar el nombre del fichero que es una fecha en formato [YYYY-MM-DD HH_MM] a
                    //  fomato dia y mes en formato texto
                    this.fechaLegible = this.renombrarFichero(audio);

                    this.accionReproductor = "Play";
                    if (this.reproductor) {
                        this.reproductor.pause();
                    }
                    this.reproductor = null;

                    this.audioSeleccionado = audio;
                    this.cargarTranscripcion(audio);

                },
                cargarTranscripcion(nombre) {
                    var url = 'https://atauri.es/notas/revisiones/txt/' + nombre;
                    //cargar la transcripcion si la hay desde el servidor con axios usando GET
                    //  a la url https://atauri.es/notas/revisiones/txt/<nombre_audio> y mostrarla en el textarea                    /*
                    try {
                        const vm = this
                        axios.get(url)
                            .then(function (data) {
                                vm.transcripcion = data.data
                            })
                    }
                    catch (error) {
                        vm.transcripcion = "Ficho no hencontrado"
                    }
                },
                guardarTranscripcion() {
                    // Enviar la transcripción como texto plano para evitar preflight CORS
                    var nombre = encodeURIComponent(this.audioSeleccionado);
                    var url = 'https://atauri.es/notas/revisiones/txt2file/' + nombre;

                    axios.post(url, this.transcripcion || '', {
                        headers: {
                            'Content-Type': 'text/plain'
                        }
                    })
                        .then((response) => {
                            console.log('Transcripción guardada:', response);
                            alert('Transcripción guardada correctamente.');
                        })
                        .catch((error) => {
                            console.error('Error guardando transcripción:', error);
                            alert('Error guardando transcripción. Revisa la consola para más detalles.');
                        });

                },
                generarFicha() {

                    var url = 'https://atauri.es/notas/revisiones/genera';

                    axios.post(url, this.transcripcion || '', {
                        headers: {
                            'Content-Type': 'text/plain'
                        }
                    })
                        .then((response) => {
                            console.log('Ficha generada:', response);
                            this.ficha = response.data;
                        })
                        .catch((error) => {
                            console.error('Error generando ficha:', error);
                            alert('Error generando ficha. Revisa la consola para más detalles.');
                        });
                },
                insertarFicha() {
                    this.ficha += `\n\nTimestamp: ${this.timestamp}`;
                    this.ficha += `\nDetalle: ${this.detalle}`;
                }

            },

            async mounted() {
                //descargar lista de audios desde el servidor
                try {
                    const response = await fetch(
                        'https://atauri.es/notas/revisiones/lista/wav'
                    );
                    const datos = await response.json();
                    this.audios = datos.archivos
                }
                catch (error) {
                    console.error('Error cargando audios:', error);
                }
                //descargar lista de transcripciones desde el servidor
                try {
                    const response = await fetch(
                        'https://atauri.es/notas/revisiones/lista/txt'
                    );
                    const datos = await response.json();
                    this.transcripciones = datos.archivos
                }
                catch (error) {
                    console.error('Error cargando transcripciones:', error);
                }
            }
        }).mount('#app');
    </script>

</body>

</html>
