<!DOCTYPE html>
<html lang="es">
<script
    src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>AudioNotas Splendid
    </title>

    <!-- Bootstrap desde CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        crossorigin="anonymous">

    <!-- Google Fonts -->
    <link rel="preconnect"
        href="https://fonts.googleapis.com">
    <link rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        rel="stylesheet"
        crossorigin="anonymous">

    <link href="app.css"
        rel="stylesheet">

    <!-- Vue desde CDN -->
    <script
        src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

</head>

<body>

    <div id="app">

        <header>
            <div
                class="container">
                <small>Splendid
                    --<
                        </small>
                        <h1>
                            Notas
                            <br>de
                            Audio
                        </h1>
            </div>
        </header>

        <main
            class="container pb-4">
            <!-- audio .wav -->
            <section
                class="card shadow-sm mb-4">
                <div
                    class="card-body">
                    <h3
                        class="h5 card-title">
                        Audios
                    </h3>
                    <small>
                        Haga
                        click
                        en un
                        audio
                        para
                        obtener
                        la
                        transcripcion
                    </small>
                    <!-- para cada audio -->
                    <ul>
                        <li v-for="audio, id in audios"
                            :key="id"
                            @click="seleccionarAudio(audio)">

                            <span
                                class="mb-0">
                                {{audio}}
                            </span>
                        </li>

                    </ul>
                </div>
            </section>

            <!-- transcripciones -->
            <section
                v-if="audioSeleccionado"
                class="card shadow-sm mb-4">
                <div
                    class="card-body">
                    <h3
                        class="h5 card-title">
                        Transcripcion:
                        <small>{{audioSeleccionado}}</small>
                    </h3>

                    <p
                        class="card-text">
                        <textarea
                            v-model="transcripcion"
                            class="form-control mt-3"
                            rows="6"
                            placeholder="Escribe aqui la ficha..."></textarea>
                    </p>

                    <div
                        class="d-flex gap-2">
                        <button
                            class="btn btn-primary"
                            @click="generarFicha">Generar
                            ficha</button>
                    </div>
                </div>

            </section>

            <!-- Ficha -->
            <section
                v-if="transcripcion"
                class="card shadow-sm">
                <div
                    class="card-body">
                    <h3
                        class="h5 card-title mb-0">
                        Ficha
                    </h3>
                    <textarea
                        v-model="ficha"
                        class="form-control mt-3"
                        rows="6"
                        placeholder="Escribe aqui la ficha..."></textarea>
                </div>
            </section>

        </main>

    </div>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>

    <script>
        const {createApp} = Vue;

        createApp({
            data() {
                return {
                    titulo: 'Notas de Audio',
                    audios: ["sdasd.wav", "asdasd.wav", "asdasd.wav"],
                    audioSeleccionado: null,
                    transcripcion: null,
                    ficha: ''
                };
            }, methods: {

                seleccionarAudio(audio) {
                    //borrar el anterior
                    this.transcripcion = null
                    this.ficha = null
                    // quitar la extensión .wav
                    audio = audio.replace('.wav', '');
                    this.audioSeleccionado = audio
                    var url = 'http://titi.etsii.urjc.es:8081/api/revisiones/transcribe/' + audio;

                    try {
                        const vm = this
                        // cambiar el cursor por el reloj de arena
                        document.body.style.cursor = 'wait';

                        axios.get(url)
                            .then(function (data) {
                                vm.transcripcion = data.data
                                //volver al cursor normal
                                document.body.style.cursor = 'default';
                            })
                    }
                    catch (error) {
                        console.error('Error cargando audios:', error);
                    }
                },
                generarFicha() {
                    const url = 'http://tit.etsii.urjc.es:8081/api/revisiones/genera/';
                    const vm = this;

                    try {
                        document.body.style.cursor = 'wait';

                        axios.post(url, {txt: this.transcripcion})
                            .then(function (data) {
                                vm.ficha = data.data;
                                document.body.style.cursor = 'default';
                            })
                            .catch(function (error) {
                                console.error('Error generando ficha:', error);
                                document.body.style.cursor = 'default';
                            });
                    }
                    catch (error) {
                        console.error('Error generando ficha:', error);
                        document.body.style.cursor = 'default';
                    }
                }
            },
            // funcion para insertar en la bases de datos


            async mounted() {
                try {
                    const response = await fetch(
                        'http://titi.etsii.urjc.es:8081/api/revisiones/lista/wav'
                    );
                    const datos = await response.json();
                    // para cada dato en datos eliminar la extension .wav
                    this.audios = datos.archivos.map(audio => audio.replace('.wav', ''));
                }
                catch (error) {
                    console.error('Error cargando audios:', error);
                }

            }
        }).mount('#app');
    </script>
